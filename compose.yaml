services:
  database:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career_os}
      POSTGRES_USER: ${POSTGRES_USER:-career_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_os_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_os} -d ${POSTGRES_DB:-career_os}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
