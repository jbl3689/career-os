spring.application.name=api

# Local defaults match compose.yaml. Standard Spring environment variables can
# override each value outside local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/career_os}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:career_os}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:career_os_local}

# Flyway owns schema creation. Hibernate may check mappings against the schema,
# but it must never create or modify tables itself.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Google sign-in uses only identity scopes. Keep the real client credentials in
# environment variables, never in this tracked file.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Gmail access is requested separately from sign-in. The custom authorization
# request resolver adds offline access so Google returns a refresh token.
spring.security.oauth2.client.registration.google-gmail.provider=google
spring.security.oauth2.client.registration.google-gmail.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google-gmail.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google-gmail.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google-gmail.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google-gmail.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.readonly

# A Base64-encoded 32-byte key used only to encrypt Google refresh tokens.
career-os.token-encryption-key=${TOKEN_ENCRYPTION_KEY}

# Login succeeds on the API, then returns the browser to the frontend.
career-os.frontend-url=${FRONTEND_URL:http://localhost:3000}

# The browser stores only the opaque session identifier. SameSite=Lax supports
# Google's top-level redirect back to localhost.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
